name: CI do backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Verificar backend
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Executar Maven verify
        working-directory: Backend
        run: bash ./mvnw -B verify

  deploy:
    name: Acionar deploy no Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Enviar commit validado ao Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Configure o secret RENDER_DEPLOY_HOOK_URL no repositorio."
            exit 1
          fi

          echo "Solicitando deploy do commit $GITHUB_SHA"
          status=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --request POST --url-query "ref=$GITHUB_SHA" "$RENDER_DEPLOY_HOOK_URL")
          case "$status" in
            200|202) echo "Deploy aceito pelo Render (HTTP $status)." ;;
            *) echo "::error::Render retornou HTTP $status."; exit 1 ;;
          esac
